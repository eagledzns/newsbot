name: viral-news-bot

# Each run is a "shift": it scans every 5 minutes for ~5.5 hours, then starts
# the next shift itself. This avoids relying on GitHub's cron, which often
# delays or drops very frequent schedules. The cron below is only a backup
# that restarts the bot if a shift ever dies.
on:
  schedule:
    - cron: "17 */2 * * *"     # backup restart every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write              # save state.json
  actions: write               # start the next shift

concurrency:
  group: newsbot
  cancel-in-progress: false    # never run two shifts at once

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt

      - name: Scan every 5 minutes for ~5.5 hours
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BREAKDOWN }}
          TELEGRAM_CHAT_ID:   "-1004429348503"
          FB_APP_ID:          ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET:      ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_TOKEN:      ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_TOKENS:     ${{ secrets.FB_PAGE_TOKENS }}
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            # pick up any code/config changes pushed since the last scan
            git pull -q --rebase -X theirs origin main || git rebase --abort || true
            pip install -q -r requirements.txt
            python bot.py --once || echo "scan failed, will retry next cycle"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "update state [skip ci]"
              for i in 1 2 3 4 5; do
                git push -q && break
                git pull -q --rebase -X theirs origin main || { git checkout --theirs state.json; git add state.json; GIT_EDITOR=true git rebase --continue; }
                sleep 3
              done
            fi
            wait=$((300 - (SECONDS - start)))
            [ $wait -gt 0 ] && sleep $wait
          done

      - name: Start the next shift
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run newsbot.yml --ref main --repo ${{ github.repository }}
