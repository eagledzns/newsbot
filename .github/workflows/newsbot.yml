name: viral-news-bot
on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min (GitHub minimum; may run a few min late)
  workflow_dispatch: {}
  push:                      # also run right after code/config changes
    branches: [main]
    paths-ignore: [state.json]
permissions:
  contents: write
concurrency: newsbot
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BREAKDOWN }}
          TELEGRAM_CHAT_ID:   "-1004429348503"   # "News update" group (not secret)
          FB_APP_ID:          ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET:      ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_TOKEN:      ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_TOKENS:     ${{ secrets.FB_PAGE_TOKENS }}
      - name: Save memory of posted stories
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          # retry if something else pushed meanwhile; keep this run's memory
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git checkout --theirs state.json; git add state.json; GIT_EDITOR=true git rebase --continue; }
            sleep 3
          done
          exit 1
